# Registration payload for the one competition service.
# Keep this file aligned with the reviewed ASP; do not create a second service.
agent:
  name: AlphaGate
  picturePath: assets/alphagate-avatar.png

service:
  name: Perpetual Momentum Signals
  title: Perpetual Momentum Signals
  billingModel: subscription
  monthlyPriceUsdt: "15"
  freeTrialHours: "72"
  description: >-
    Perpetual trading signals, sent continuously with auto-copy support. Example:
    [Perpetual Signal] BTC-USDT-SWAP | LONG 0.02x | Entry 65000-65200 | SL 64000 |
    TP1 67200 | Position 2% | Valid for 4h. Exits are also published, for example
    [Perpetual Signal] BTC-USDT-SWAP | EXIT LONG | CLOSE 25% | @67200 | ref S-xxx.
    Before subscribing, users confirm Trade Kit authorization, live/demo mode,
    auto-copy, sizing, margin mode, and execution method. After subscription,
    the system monitors orders, parses signals, and trades under the confirmed
    settings.

# AlphaGate — policy configuration.
#
# Accounting basis: Agent Trade Kit, USDT perpetuals. Chosen and irreversible.
#
# RULE: this file holds POLICY (our choices). It must never hold VENUE FACTS
# (fee tiers, tick size, lot size, minimum notional, per-instrument max
# leverage, funding schedule). Those are discovered at runtime and written to
# config/runtime-profile.tradekit.yaml. If you are typing a number that
# describes the venue, it does not belong here.
#
# Every value below is loaded at runtime. Changing a threshold is a YAML edit,
# never a rebuild.

# The competition clock. POLICY only in the sense that we transcribe it; the
# times themselves come from the event page (rule 1) and are not ours to choose.
#
# The engine refuses to open a position outside [startsAt, endsAt]. A fill before
# the start does not score, cannot be undone, and moves equity — and the Part X
# endgame is measured backwards from `endsAt`, so both ends are load-bearing.
competition:
  startsAt: "2026-08-11T12:00:00+08:00"
  endsAt: "2026-08-25T12:00:00+08:00"

  # PART X — the endgame, measured back from endsAt.
  #
  # Unrealised PnL counts at the final snapshot, so an open position at the close
  # is a live bet on the prize. DeepSeek went +125% -> +4.89% for want of this.
  #
  # These are the TIME-conditional half of Part X and they run unconditionally.
  # The rank-conditional half (step 1, "rank steering confirms a prize band")
  # needs a leaderboard parser that cannot exist until the page does on Aug 11.
  # An endgame that fires on the clock is worth far more than one that waits for
  # a parser, so the clock does not depend on the rank.
  endgame:
    # Stop opening new positions. A trade opened here cannot reach its 36h max
    # hold before the snapshot, so it is a coinflip resolved by the clock.
    noNewEntriesHoursBeforeEnd: 48
    # Close losing and flat positions. They are not going to come back inside a
    # day, and a loser carried into the snapshot is a realised loss taken late.
    closeLosersHoursBeforeEnd: 24
    # Winners are held into the snapshot on a tightened trail: the trail converts
    # a coinflip into a floor. Tighter than the tightened trail (2.5x) because
    # there is no longer any tail left to pay for the room.
    chandelierAtrMultiple: 1.5

capital:
  # Principal Base locks at registration and is the PnL% denominator for the
  # whole competition. It never changes. Depositing permanently damages half the
  # score, so there is no code path that can request one.
  principalBaseUsdt: 320
  # Eligibility floor from the rules. The 20 above it is the compliance buffer.
  eligibilityFloorUsdt: 300
  # No cash reserve: Principal Base is fixed regardless of deployment, so idle
  # balance is pure drag on the percentage axis. Margin efficiency comes from
  # leverage, not from holding cash back.

risk:
  # Fixed fractional risk per attempt, by stage. Law 9: the agent must be
  # structurally incapable of varying risk per trade. One function, no override.
  riskFractionByStage:
    1: 0.02
    2: 0.03
    3: 0.01

  # Portfolio heat. Crypto perps correlate around 0.8 — three longs is one trade
  # wearing three hats. This is the control that would have saved the model that
  # sat in six losing shorts.
  maxPortfolioHeat: 0.06
  maxConcurrentPositions: 3
  maxPositionsPerCorrelationGroup: 2

  # Portfolio-wide directional cap. The correlation groups below catch instruments
  # we KNEW to be related; this catches the ones we did not.
  #
  # E3 takes momentum extremes, and in crypto the extremes are almost always the
  # same complex moving together — a live scan on 2026-08-09 produced BOME,
  # PEOPLE, PARTI, NEIRO and ESP, all long, none of them in any group below. With
  # 3 slots, a cap of 2 means the third position must disagree with the first two
  # or not exist. That is the difference between a portfolio and a single bet
  # placed three times.
  maxPositionsPerSide: 2

  # Drawdown governor, measured from PEAK equity, stage-aware.
  drawdownGovernor:
    1: { halveSizing: 0.18, flatAndHalt12h: 0.28, stopForCompetition: 0.38 }
    2: { halveSizing: 0.15, flatAndHalt12h: 0.25, stopForCompetition: 0.35 }
    3: { halveSizing: 0.08, flatAndHalt12h: 0.12, stopForCompetition: 0.18 }

  haltDurationHours: 12
  stage2EquityMultiple: 2.0

  # Minimum target:stop ratio. No signal is issued without all four of entry,
  # stop, target and size, and the target must clear this.
  minTargetStopRatio: 3.0

  # A dead feed returning its last value drains the account for a full day
  # before anyone notices.
  maxFeedStalenessSeconds: 30
  maxLeaderboardStalenessMinutes: 30
  reconcileIntervalSeconds: 300

execution:
  # Isolated always. Cross margin means one bad position can consume the equity
  # backing every other; isolated caps damage at that position's margin.
  marginMode: isolated

  # maxLeverage is DELIBERATELY ABSENT until the Part IX stop verification
  # writes it. A missing value throws — it must never fall back to a default.
  #
  #   venue-held resting stops confirmed -> 5
  #   client-held stops only             -> 2, pyramiding disabled, watchdog required
  #   no stop capability                 -> do not trade, escalate
  #
  # It is a CAP that rejects an oversized trade, never a target. With 2% risk
  # and ATR stops, realised leverage should land between 0.5x and 2x; the cap
  # exists to catch a pathological stop-distance calculation.

  # Hard cap on cumulative fees as a share of Principal Base. Halt new entries
  # on breach. DeepSeek paid a third of Qwen's fees and posted a better Sharpe.
  feeBudgetFraction: 0.06

universe:
  # E1. The venue lists 423 live USDT perps including tokenised equities and
  # commodities, so this filter does real work rather than accepting the list.
  # Breadth is the strategy — at any moment something is trending violently —
  # so these thresholds should admit tens of instruments, not a handful.
  # Plain digits: YAML has no numeric separators, and 20_000_000 parses as a
  # string that the schema then rejects.
  minQuoteVolume24hUsdt: 20000000
  maxSpreadBps: 5

  # E1 must also reject instruments we cannot afford one unit of.
  #
  # An instrument whose minimum order is larger than the notional we would place
  # is not in the universe — it is a rejection waiting to happen, and because the
  # signal is journalled before submission, that rejection is never retried. It
  # would look like breadth in the scan and produce nothing in the book.
  #
  # The floor is the SMALLEST notional the engine expects to place. Notional is
  # riskUsdt / stopFraction, so at stage 1 (2% of 320 = 6.4 USDT) a wide 10% ATR
  # stop gives 64 USDT and a tight 4% stop gives 160. 60 is the conservative end
  # of that range: an instrument we cannot trade on our widest stop is one we
  # would only ever reach by luck of volatility.
  minTradableNotionalUsdt: 60
  # Tokenised equities and commodities trade on the venue as perps but gap
  # across traditional market hours and weekends, which breaks the ATR and
  # breakout logic. Excluded by explicit symbol list, refreshed when the venue
  # adds more — never by a name-pattern guess.
  excludeSymbols:
    - AAPL
    - ADBE
    - AMD
    - AMZN
    - AVGO
    - COIN
    - CRCL
    - GOOGL
    - HOOD
    - IBM
    - INTC
    - META
    - MSFT
    - MSTR
    - NFLX
    - NVDA
    - ORCL
    - PLTR
    - QQQ
    - SPY
    - TSLA
    - TSM
    - XAG
    - XAU
    - XPD
    - XPT

signals:
  # Conviction gate. Qwen averaged ~83 across 22-36 trades in 17 days; the
  # models that died overtraded.
  minConviction: 75
  targetTradesPerDay: 2

  # Regime gate: if fewer than this many extreme candidates pass, the regime is
  # unfavourable and the agent stands down. E3 takes a 10% tail from each side;
  # with the reachable universe usually below 30 instruments that is at most two
  # candidates total. Requiring three made E2 stand down by construction rather
  # than because the market was choppy.
  minInstrumentsPassingRegime: 2

regime:
  # E2. Capital is destroyed by failed attempts in chop, not by the one big
  # loser. This filter is the difference between arriving at the one great
  # trend with most of the account or a fraction of it.
  adxPeriod: 14
  minAdx: 22
  # Realized volatility band, per 1h bar, as a fraction. Too low means no
  # follow-through; too high means stops get wicked out.
  volLookback: 24
  minRealizedVol: 0.002
  maxRealizedVol: 0.030
  # Volume must be expanding, not merely present. A breakout on contracting
  # volume is the classic false break.
  volumeWindow: 12
  minVolumeTrend: 1.0
  # Funding working against the intended direction is both a carrying cost and
  # a crowding signal. Expressed per funding interval, as a fraction.
  #
  # Lowered from 0.0005. That threshold was set as a CROWDING filter and read as
  # though it were free. It is not: funding is paid every 8 hours, the hold band
  # is 4-36h, so an at-threshold trade pays up to 5 windows. At 0.0005 that is
  # 0.25% of notional on one trade, against a 6% total fee budget spread over
  # ~40 trades — 0.15% each. One "acceptable" funding rate consumed 1.7 trades of
  # budget while the fee tracker reported 2 bps maker and looked healthy.
  #
  # The threshold is now a backstop rather than the control. The control is
  # `fundingCharged` below, which makes the cost change the trade instead of
  # merely vetoing it.
  maxAdverseFundingRate: 0.0002

  # Charge expected funding against the payoff test.
  #
  # A filter answers "is this rate tolerable". Charging answers the question that
  # matters: does this trade still clear 3:1 AFTER carry. Below, the expected
  # cost is pushed into the target, so a trade with expensive funding needs a
  # bigger move to qualify — and one that cannot offer it is simply not a signal.
  fundingCharged: true
  # Hours per funding window. Strictly a VENUE FACT, sitting here against the
  # rule at the top of this file, and the exception is deliberate: it is 8 for
  # every OKX USDT perp and the alternative is a cost model that cannot be
  # evaluated until the runtime profile loads. Move it to the profile when the
  # profile learns to carry it — it is NOT verified today, which makes it the
  # one number in this file that is assumed rather than measured.
  fundingWindowHours: 8

# Correlation groups. POLICY: our judgement about what moves together, not a
# venue fact. maxPositionsPerCorrelationGroup does nothing without this — perps
# correlate around 0.8, so three "different" longs is one trade wearing three
# hats, which is the failure mode that kills accounts in a drawdown.
#
strategy:
  # Frozen after the 540-day exact-cost tournament. Changing this mode changes
  # both entry and exit architecture; it is not a runtime tuning knob.
  mode: frozen-short-continuation

# Deliberately coarse. A fine-grained taxonomy would let three L1 alts through
# as three groups, which is the exact concentration this is meant to prevent.
correlationGroups:
  majors:
    - BTC
    - ETH
  layer1:
    - SOL
    - AVAX
    - ADA
    - DOT
    - ATOM
    - NEAR
    - APT
    - SUI
    - SEI
    - TON
    - TRX
    - BNB
  layer2:
    - ARB
    - OP
    - MATIC
    - POL
    - STRK
    - ZK
    - MANTA
  defi:
    - UNI
    - AAVE
    - LINK
    - MKR
    - CRV
    - LDO
    - PENDLE
    - ENA
  memes:
    - DOGE
    - SHIB
    - PEPE
    - WIF
    - BONK
    - FLOKI
    - TRUMP

# A GROUP NAME, not a prefix: every symbol named in no list above lands in this
# one shared bucket and counts against maxPositionsPerCorrelationGroup together.
#
# This reverses an earlier decision, and the reversal is the point. Giving each
# unlisted symbol its own bucket was defended on the grounds that two unrelated
# small caps should not count as a correlated pair. True in general, and wrong at
# this size: with 3 slots and 320 USDT, a false refusal costs one trade, while
# the concentration it permits costs the account. The 2026-08-09 scan is the
# evidence — five unlisted memecoins, five private buckets, cap satisfied.
#
# The name says what it is. Anything the venue lists that we have not classified
# is, in practice, a high-beta alt.
ungroupedGroup: HIGHBETA_ALT

ranking:
  # E3. Momentum normalised by ATR so a 3% BTC move and a 12% alt move are
  # comparable. Multiple lookbacks so a single bar cannot dominate.
  lookbacksHours: [4, 12, 24]
  atrPeriod: 14
  # Only the extremes are traded: strongest for longs, weakest for shorts.
  decileFraction: 0.1

entry:
  # E4. Breakout of an N-period high (long) or low (short) on the 1h chart.
  breakoutLookback: 24

  # Entries are limit orders inside a band, not market orders. Maker is 2 bps
  # against taker 5 bps (measured), and across ~40 trades that difference is
  # real money at 320 of capital. The band is expressed in ATR so it scales
  # with each instrument's volatility.
  bandAtrFraction: 0.25

  # How long a published signal remains actionable. Long enough for the copy
  # executor to act, short enough that a stale signal cannot be filled into a
  # market that has already moved.
  validityHours: 4

  # Conviction is a composite, scored 0-100, gated at signals.minConviction.
  # Weights must sum to 1. Confidence decides WHETHER to trade, never how much
  # (Law 9) — these weights never touch position size.
  convictionWeights:
    momentum: 0.35 # rank within the surviving universe
    trendStrength: 0.25 # ADX above the regime floor
    volume: 0.25 # expansion beyond the regime floor
    multiTimeframe: 0.15 # 4h agreeing with the 1h signal

  # Saturation points for the score components. Beyond these, more is not
  # better — an ADX of 80 is not twice as tradable as 40, it is usually late.
  adxSaturation: 45
  volumeTrendSaturation: 3.0

exits:
  # Stops are ATR-scaled, never a fixed percentage. ATR adapts to each
  # instrument's volatility, which is what makes a 3% stop on BTC and a 9% stop
  # on a high-beta alt equivalent risk.
  atrPeriod: 14
  # Wider initial room, with risk-based sizing keeping dollar risk constant.
  initialStopAtrMultiple: 2.5

  # Keep the first scale-out small: the right tail is the strategy's expectancy.
  scaleOutAtR: 2.0
  scaleOutFraction: 0.15

  chandelierAtrMultiple: 3.0
  tightenTrailAtR: 4.0
  # Deliberately equal to the initial trail. The tail is not squeezed at +4R.
  tightenedChandelierAtrMultiple: 3.0

  # Give a trend two days to resolve; only close it if it is still below +0.5R.
  timeStopHours: 48
  timeStopRequiresR: 0.5
  minHoldHours: 4
  maxHoldHours: 48

  # No re-entry on an instrument after a stop-out.
  reentryCooldownHours: 4

pyramiding:
  # Stage 2 only, past +2R, stop at breakeven or better.
  enabled: false
  maxAdds: 2
  # Each add smaller than the last. Decreasing sizes plus the stack-wide
  # trailing stop are what separate this from over-leveraging in disguise.
  addSizeMultiples: [1.0, 0.6, 0.4]

attribution:
  # If the realised payoff ratio drops below this over enough closed trades,
  # the exit logic is broken — investigate before trading further.
  minRealisedPayoffRatio: 2.5
  payoffRatioMinTrades: 10

ledger:
  path: var/ledger.sqlite

killSwitch:
  path: var/kill-switch

# Cooldowns, open-position history and peak equity. Must survive restart: a
# cooldown that resets on restart invites re-entry into the instrument that just
# stopped us out, exactly when a crash makes a restart likely.
engineState:
  path: var/engine-state.json

publishing:
  maxSignalChars: 200
  perpHeader: "[Perpetual Signal]"
  statusHeader: "[Perpetual Status]"
  # Law 6: every trade originates from a published signal. The executor may act
  # only on signals that were actually delivered.
  requireSignalCorrespondence: true

  # EXITS ARE TRADES. Every scale-out, breakeven move, ratchet, time stop and
  # close is a fill OKX will compare against our published signals, and roughly
  # half of all fills are exits. Publishing entries only means half the book has
  # no corresponding signal — and a subscriber on auto-copy is told to open and
  # never told to close.
  #
  # The ordering is deliberately the INVERSE of an entry. An entry publishes and
  # then trades, so an undelivered signal is never traded. An exit trades and
  # then publishes, because gating a close on the ASP being reachable would mean
  # a dead publisher leaves us holding a losing position we are not allowed to
  # exit. An unpublished entry is a rule breach we chose to commit; an
  # unpublished exit is one the venue committed to us while we held risk.
  publishExits: true
